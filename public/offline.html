<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không có kết nối - STEM Vietnam</title>
  <style>
    :root {
      --ink: #1f2a37;
      --muted: #5c6774;
      --paper: #f7f3ee;
      --card: #fffaf4;
      --stroke: #e4d7c7;
      --accent: #d97706;
      --accent-deep: #b45309;
      --sea: #0f766e;
      --sea-deep: #115e59;
      --shadow: 0 30px 80px rgba(30, 24, 16, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top, #fef7ed 0%, #f2e9dd 45%, #e9f1ee 100%);
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(15, 118, 110, 0.12), transparent 45%),
        radial-gradient(circle at 85% 15%, rgba(217, 119, 6, 0.15), transparent 40%),
        repeating-linear-gradient(120deg, rgba(31, 42, 55, 0.03) 0 2px, transparent 2px 10px);
      opacity: 0.9;
    }

    .offline-shell {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(32px, 5vw, 72px);
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: clamp(28px, 4vw, 56px);
      align-items: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 28px 28px 28px 8px;
      padding: clamp(24px, 4vw, 40px);
      box-shadow: var(--shadow);
      display: grid;
      gap: 18px;
      animation: rise 0.7s ease-out both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: #f1e6d8;
      color: var(--sea-deep);
    }

    .badge::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sea), var(--accent));
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.15);
    }

    h1 {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: clamp(28px, 3.4vw, 42px);
      line-height: 1.1;
      color: var(--ink);
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--sea-deep);
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--sea);
      box-shadow: 0 0 0 8px rgba(15, 118, 110, 0.12);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button,
    a {
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 999px 18px 18px 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(217, 119, 6, 0.25);
    }

    .btn-ghost {
      border: 1px solid var(--stroke);
      background: transparent;
      color: var(--ink);
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
      text-decoration: none;
    }

    .btn-ghost:hover {
      border-color: var(--sea);
      color: var(--sea-deep);
      background: rgba(15, 118, 110, 0.08);
    }

    .hint {
      font-size: 13px;
      color: #7a6f63;
      background: #fbf3e8;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px dashed #e6d5c2;
    }

    .art {
      position: relative;
      display: grid;
      place-items: center;
      padding: clamp(16px, 3vw, 28px);
      animation: rise 0.7s ease-out both;
      animation-delay: 0.1s;
    }

    .art-card {
      width: min(360px, 100%);
      background: #fefaf5;
      border-radius: 32px;
      border: 1px solid rgba(228, 215, 199, 0.7);
      box-shadow: 0 24px 60px rgba(17, 24, 39, 0.1);
      padding: 24px;
      position: relative;
    }

    .art-card::after {
      content: "STEM";
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
      color: rgba(31, 42, 55, 0.4);
    }

    .signal {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(0.92);
        opacity: 0.75;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 860px) {
      .offline-shell {
        grid-template-columns: 1fr;
      }

      .art {
        order: -1;
      }
    }
  </style>
</head>

<body>
  <main class="offline-shell">
    <section class="card">
      <span class="badge">STEM Vietnam · Offline</span>
      <h1>Kết nối đang bị gián đoạn.</h1>
      <p>Thiết bị chưa có internet hoặc mạng đang chập chờn. Bạn có thể thử tải lại hoặc quay về trang đã mở trước đó.</p>
      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Đang chờ kết nối ổn định...</span>
      </div>
      <div class="actions">
        <button class="btn-primary" onclick="location.reload()">Thử lại</button>
        <a class="btn-ghost" href="/" aria-label="Về trang chủ">Về trang chủ</a>
      </div>
      <div class="hint">Mẹo nhỏ: bật lại Wi‑Fi/4G hoặc thử đổi sang mạng khác nếu có.</div>
    </section>

    <aside class="art" aria-hidden="true">
      <div class="art-card">
        <svg class="signal" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="70" y1="196" x2="250" y2="56" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0f766e" stop-opacity="0.2" />
              <stop offset="1" stop-color="#d97706" stop-opacity="0.4" />
            </linearGradient>
            <linearGradient id="line" x1="40" y1="200" x2="280" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1f2a37" />
              <stop offset="1" stop-color="#0f766e" />
            </linearGradient>
          </defs>
          <rect x="14" y="16" width="292" height="208" rx="28" fill="#f9efe3" stroke="#e1d3c2"
            stroke-width="2" />
          <path d="M60 188C90 142 150 110 200 122C240 132 262 164 270 188" stroke="url(#beam)"
            stroke-width="18" stroke-linecap="round" />
          <path d="M70 180L142 112L242 148" stroke="url(#line)" stroke-width="4" stroke-linecap="round"
            stroke-linejoin="round" />
          <circle cx="70" cy="180" r="10" fill="#fffaf4" stroke="#0f766e" stroke-width="4" />
          <circle cx="142" cy="112" r="12" fill="#fffaf4" stroke="#d97706" stroke-width="4" />
          <circle cx="242" cy="148" r="10" fill="#fffaf4" stroke="#0f766e" stroke-width="4" />
          <path d="M106 60C128 42 160 34 192 40" stroke="#b45309" stroke-width="3"
            stroke-linecap="round" />
          <path d="M120 76C138 64 160 58 182 60" stroke="#0f766e" stroke-width="3"
            stroke-linecap="round" />
        </svg>
      </div>
    </aside>
  </main>
</body>

</html>
